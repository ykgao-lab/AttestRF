# Fixed reference rules. Dataset-specific fit residual limits must be
# estimated from source validation data before target evaluation.
wisig:
  overall_containment: 1.0
  stratum_containment: {}
  maximum_residual: {}
  minimum_accuracy: {}

migration:
  overall_containment: 0.9047619047619048  # 19 of 21 checking measurements.
  stratum_containment:
    0.5m: 0.8571428571428571  # 6 of 7 checking devices at each distance.
    1.0m: 0.8571428571428571
    1.5m: 0.8571428571428571
  maximum_residual: {}
  minimum_accuracy: {}

rf_scnl:
  overall_containment: 1.0
  stratum_containment: {}
  # Name the assessed-day stratum target_day. Before using this rule, add
  # maximum_residual[target_day] from source validation and pass all six
  # reference identities as residual_check_ids.
  maximum_residual: {}
  minimum_accuracy:
    target_day: 0.8
