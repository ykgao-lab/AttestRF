[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "attestrf"
version = "0.1.0"
description = "Reference-assisted certificates for RF fingerprint identification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Yikai Gao", email = "ykgao@nudt.edu.cn"},
  {name = "Hui Liu", email = "liuhui17c@nudt.edu.cn"},
]
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pyarrow>=12.0",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.1"]

[tool.setuptools.packages.find]
where = ["src"]
